# .koyeb.yaml
# Koyeb Service Configuration for HackJudge Participant Portal
# This configuration file can be used with the Koyeb CLI or connected repository.

name: hackjudge-participant-portal
services:
  - name: participant-portal
    type: web
    git:
      branch: main
      no_deploy_on_push: false
      workdir: /
    ports:
      - port: 3000
        protocol: http
    routes:
      - path: /
        port: 3000
    regions:
      - fra # Europe (Frankfurt) - free tier eligible region
    instance_type: nano # Free tier nano instance (512MB RAM, 0.1 vCPU)
    env:
      - key: PORT
        value: "3000"
      - key: VITE_ADMIN_PASSWORD
        value: "admin"
      - key: VITE_HACKATHON_END_TIME
        value: "2026-12-01T18:00:00Z"
      # Supabase credentials and Judging Engine URL should be configured
      # directly in the Koyeb Web Console dashboard.
      # VITE_SUPABASE_URL
      # VITE_SUPABASE_ANON_KEY
      # VITE_JUDGING_ENGINE_URL
